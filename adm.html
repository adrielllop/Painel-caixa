<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Admin — Histórico de Caixa</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f8f4ec,#eee8dc);color:#23322d;font-family:Inter,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px}
.card{background:rgba(255,253,248,.97);border:1px solid #d8c7ae;border-radius:22px;padding:20px;margin-bottom:18px;box-shadow:0 16px 40px #6b4b2a18}.brand{text-align:center;margin-bottom:10px}.brand img{width:min(300px,70%);max-height:120px;object-fit:contain;border-radius:14px}.brand-line{height:2px;background:linear-gradient(90deg,transparent,#b47a3c,transparent);margin:10px 0 18px}h1{margin:0 0 5px}.sub{color:#9db0ca}.top{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
button{border:0;border-radius:11px;padding:12px 15px;font-weight:800;cursor:pointer}.danger{background:#a93636;color:white}.normal{background:#b47a3c;color:white}
.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:12px 10px;border-bottom:1px solid #ded1bd;text-align:left;font-size:13px}th{color:#6b705f}
.ok{color:#42d69b}.bad{color:#ff6378}.surplus{color:#69a2ff}.empty{text-align:center;padding:35px;color:#9db0ca}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.stat{background:#f5efe4;border:1px solid #d8c7ae;border-radius:14px;padding:14px;min-width:160px}.stat b{font-size:20px;display:block;margin-top:4px}

:root{--bg1:#f8f4ec;--bg2:#eee8dc;--text:#23322d;--card:rgba(255,253,248,.97);--border:#d8c7ae;--muted:#6d756e;--input:#fff;--inputText:#26342e;--accent:#b47a3c;--soft:#f5efe4;--line:#ded1bd}
body.dark{--bg1:#07111f;--bg2:#0d1726;--text:#eef4ff;--card:rgba(16,29,48,.97);--border:#2b405c;--muted:#9db0ca;--input:#091524;--inputText:#eef4ff;--accent:#c89255;--soft:#0f1c2d;--line:#223552}
body{background:linear-gradient(135deg,var(--bg1),var(--bg2)) !important;color:var(--text) !important}
.card{background:var(--card) !important;border-color:var(--border) !important}
.sub,.muted,.empty{color:var(--muted) !important}
label{color:var(--muted) !important}
input{border-color:var(--border) !important;background:var(--input) !important;color:var(--inputText) !important}
.result,.stat{background:var(--soft) !important}
button.normal,#calcular{background:var(--accent) !important}
.theme-toggle{width:auto;margin:0 0 0 auto;padding:10px 14px;border-radius:12px;background:var(--accent);color:#fff;border:0;font-weight:800;cursor:pointer;box-shadow:0 5px 14px #0002}
.theme-row{display:flex;justify-content:flex-end;margin-bottom:12px}

</style></head>
<body><div class="wrap"><div class="theme-row"><button type="button" class="theme-toggle" id="themeToggle">🌙 Modo escuro</button></div>
<div class="card"><div class="brand"><img src="https://i.postimg.cc/4NSH266z/IMG-20260823-WA0039.jpg" alt="Pacheco Panificadora"></div><div class="brand-line"></div><div class="top"><div><h1>📊 Painel Admin</h1><div class="sub">Histórico dos fechamentos de caixa</div></div>
<button class="danger" id="limpar">🗑 Apagar todo o histórico</button></div>
<div class="stats"><div class="stat">Fechamentos<b id="qtd">0</b></div><div class="stat">Soma das diferenças<b id="saldo">R$ 0,00</b></div></div></div>
<div class="card"><div class="table"><table><thead><tr><th>Data/Hora</th><th>Caixa</th><th>Operador</th><th>Crédito</th><th>Débito</th><th>Pix</th><th>Dinheiro</th><th>Abertura</th><th>Contado</th><th>Resultado</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div><div id="empty" class="empty">Carregando...</div></div>
</div>

<script>
(function(){
  const body=document.body, btn=document.getElementById('themeToggle');
  const saved=localStorage.getItem('pacheco-theme');
  if(saved==='dark') body.classList.add('dark');
  function update(){btn.textContent=body.classList.contains('dark')?'☀️ Modo claro':'🌙 Modo escuro';}
  update();
  btn.onclick=function(){
    body.classList.toggle('dark');
    localStorage.setItem('pacheco-theme',body.classList.contains('dark')?'dark':'light');
    update();
  };
})();
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getFirestore,collection,onSnapshot,query,orderBy,deleteDoc,doc,getDocs,writeBatch} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
/* COLE A MESMA CONFIGURAÇÃO DO FIREBASE AQUI */
const firebaseConfig = {
  apiKey: "AIzaSyCmPGnWGvb7B4Mn3-mY9gH7sH87PRC3agY",
  authDomain: "fechamento-de-caixa-d95b4.firebaseapp.com",
  projectId: "fechamento-de-caixa-d95b4",
  storageBucket: "fechamento-de-caixa-d95b4.firebasestorage.app",
  messagingSenderId: "822136579321",
  appId: "1:822136579321:web:8f4ff918409a413c072e28",
  measurementId: "G-53G4TXX9BM"
};
const app=initializeApp(firebaseConfig),db=getFirestore(app);
const money=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const fmt=t=>t?.toDate?t.toDate().toLocaleString("pt-BR"):t?new Date(t).toLocaleString("pt-BR"):"—";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const q=query(collection(db,"fechamentos"),orderBy("criadoEm","desc"));
onSnapshot(q,snap=>{
 let html="",total=0;
 snap.forEach(d=>{
  const x=d.data(), diff=Number(x.diferenca||0); total+=diff;
  const cls=Math.abs(diff)<.005?"ok":diff>0?"surplus":"bad";
  const res=Math.abs(diff)<.005?"✅ Correto":diff>0?"💰 Sobrou "+money(diff):"⚠️ Faltou "+money(Math.abs(diff));
  html+=`<tr><td>${fmt(x.criadoEm)}</td><td>Caixa ${esc(x.caixa || "—")}</td><td>${esc(x.operador)}</td><td>${money(x.credito)}</td><td>${money(x.debito)}</td><td>${money(x.pix)}</td><td>${money(x.vendasDinheiro)}</td><td>${money(x.abertura)}</td><td>${money(x.contado)}</td><td class="${cls}">${res}</td><td><button class="danger" data-id="${d.id}">Excluir</button></td></tr>`;
 });
 document.getElementById("tbody").innerHTML=html;
 document.getElementById("empty").style.display=snap.empty?"block":"none";
 document.getElementById("empty").textContent=snap.empty?"Nenhum fechamento registrado.":"";
 document.getElementById("qtd").textContent=snap.size;
 document.getElementById("saldo").textContent=money(total);
 document.querySelectorAll("[data-id]").forEach(b=>b.onclick=async()=>{if(confirm("Excluir este fechamento?"))await deleteDoc(doc(db,"fechamentos",b.dataset.id))});
},e=>document.getElementById("empty").textContent="Erro ao carregar histórico. Confira Firebase e as regras.");
document.getElementById("limpar").onclick=async()=>{
 if(!confirm("ATENÇÃO: apagar TODO o histórico?"))return;
 const snap=await getDocs(collection(db,"fechamentos")); let batch=writeBatch(db);
 snap.forEach(d=>batch.delete(d.ref)); await batch.commit();
};
</script></body></html>
